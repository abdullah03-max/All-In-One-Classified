name: all_in_one_classified_app
description: "All In One Classified Marketplace - User Mobile Application (Android & iOS)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase SDK
  supabase_flutter: ^2.8.0
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation & Routing
  go_router: ^14.2.0
  
  # Security & Storage
  flutter_secure_storage: ^9.2.0
  
  # Media & Picker
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  
  # Audio Messaging (Voice Notes)
  audioplayers: ^6.0.0
  record: ^5.1.2
  path_provider: ^2.1.3
  
  # Utilities & Phone Dialing
  url_launcher: ^6.3.0
  intl: ^0.19.0
  http: ^1.2.1
  app_links: ^7.0.0
  google_sign_in: ^6.2.1
  
  # Location & Geocoding
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Payments (Safepay Checkout Webview)
  webview_flutter: ^4.8.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

